services:
  - type: web
    name: breakthru-assessment-portal
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate --noinput && gunicorn breakthru_portal.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "bt.assesment.pk,bt.assessment.pk,breakthru.assesment.portal,assessment.breakthru.pk,.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://bt.assesment.pk,https://breakthru.assesment.portal,https://*.onrender.com"
      - key: PORTAL_URL
        value: "https://bt.assesment.pk"
